    @keyframes run { 0%, 2% { opacity: 0; } 3%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .passed { opacity: 0; animation: show 14s linear infinite 7s; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
