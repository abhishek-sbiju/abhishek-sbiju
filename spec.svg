<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="portfolio.spec.ts — all checks pass: engineer and founder, Playwright migration at FourKites, five Versor customers, Codeforces Specialist">
  <style>
    text { font-family: 'Courier New', ui-monospace, monospace; font-size: 16px; }
