<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Ship it. Prove it. — Abhishek Smitha Biju">
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7317"/>
      <stop offset="0.5" stop-color="#f1d97a"/>
      <stop offset="1" stop-color="#8f7317"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1.2 0" to="1.2 0" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
    <pattern id="marks" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M28 22v12M22 28h12" stroke="#d4af37" stroke-opacity="0.16" stroke-width="1.2" fill="none"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="56 56" dur="14s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="wave">
      <path d="M0 0H1200V218C900 258 700 190 400 226C250 244 120 210 0 232Z">
        <animate attributeName="d" dur="9s" repeatCount="indefinite"
          values="M0 0H1200V218C900 258 700 190 400 226C250 244 120 210 0 232Z;
                  M0 0H1200V230C920 196 680 250 420 210C240 190 140 246 0 214Z;
                  M0 0H1200V218C900 258 700 190 400 226C250 244 120 210 0 232Z"/>
      </path>
    </clipPath>
  </defs>
  <style>
    .line { font-family: 'Courier New', ui-monospace, monospace; font-size: 16px; letter-spacing: 3px; fill: #a49d89; opacity: 0; }
    .l1 { animation: cyc 12s linear infinite; }
    .l2 { animation: cyc 12s linear infinite 3s; }
    .l3 { animation: cyc 12s linear infinite 6s; }
    .l4 { animation: cyc 12s linear infinite 9s; }
    @keyframes cyc { 0% { opacity: 0; } 4%, 21% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  </style>
  <g clip-path="url(#wave)">
    <rect width="1200" height="260" fill="#14130f"/>
    <rect width="1200" height="260" fill="url(#marks)"/>
    <rect width="8" height="260" fill="url(#rail)"/>
    <text x="64" y="108" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="1" fill="#f0ede3">SHIP IT.</text>
    <text x="356" y="108" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="1" fill="url(#foil)">PROVE IT.</text>
    <text class="line l1" x="64" y="152">ABHISHEK SMITHA BIJU — ENGINEER &amp; FOUNDER</text>
    <text class="line l2" x="64" y="152">FOUNDER @ VERSOR · 5 PAYING RESTAURANTS</text>
    <text class="line l3" x="64" y="152">SWE INTERN @ FOURKITES · PLAYWRIGHT AUTOMATION</text>
    <text class="line l4" x="64" y="152">CODEFORCES SPECIALIST · 265+ PROBLEMS SOLVED</text>
    <rect class="pulse" x="64" y="176" width="9" height="9" fill="#3ecf8e"/>
    <text x="84" y="185" font-family="'Courier New', ui-monospace, monospace" font-size="13" letter-spacing="3" fill="#d4af37">OPEN TO SWE INTERNSHIPS</text>
  </g>
</svg>
